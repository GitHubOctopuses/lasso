<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 120" width="460" height="120">
  <!-- lasso · 午夜套索 lockup（自适应亮暗背景）-->
  <style>
    .word { font: 700 64px/1 "Segoe UI", "Geist", Arial, sans-serif; letter-spacing: -1.5px; }
    .tag  { font: 400 14px/1 "Segoe UI", "Microsoft YaHei", sans-serif; letter-spacing: 5px; }
    .wordfill { fill: #121212; }
    .tagfill  { fill: #67676F; }
    @media (prefers-color-scheme: dark) {
      .wordfill { fill: #F7F7F8; }
      .tagfill  { fill: #A0A0AA; }
    }
  </style>
  <!-- 标志：暗色芯片 + 抛出的青柠绳圈 -->
  <g transform="translate(8,18)">
    <rect width="84" height="84" rx="22" fill="#272727"/>
    <g transform="rotate(-16 44 44)">
      <ellipse cx="44" cy="44" rx="20" ry="14" fill="none" stroke="#A3E635" stroke-width="8" stroke-linecap="round"/>
    </g>
    <path d="M59 32 C 66 23.5, 64.5 16.5, 73 13" fill="none" stroke="#A3E635" stroke-width="8" stroke-linecap="round"/>
  </g>
  <text class="word wordfill" x="116" y="72">lasso</text>
  <text class="tag tagfill" x="120" y="98">视频下载器 · 本机运行</text>
</svg>
