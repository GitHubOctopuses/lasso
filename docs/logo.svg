<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 96" width="420" height="96">
  <!-- lasso wordmark: the final o is the lasso loop -->
  <defs>
    <linearGradient id="rope" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <text x="8" y="72" font-family="Segoe UI, Futura, Helvetica, Arial, sans-serif" font-size="72" font-weight="800" letter-spacing="-1" fill="#1c1917">lass</text>
  <path d="M300 58 A 26 26 0 1 1 299.4 28 C 307 35 314 55 323 74"
        fill="none" stroke="url(#rope)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="8" y="92" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" letter-spacing="4" fill="#a8a29e">套住任何视频，一拉就走</text>
</svg>
